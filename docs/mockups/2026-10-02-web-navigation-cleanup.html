function art(){return '<div class="tape" aria-hidden="true">'+tape+'</div>'}
function row(n,i){return `<button class="mixrow" onclick="preview('Open mix: ${n}')">${art()}<div class="copy"><h3>${n}</h3><small>${12+i*2} songs · ${i<2?'Yesterday':'Last week'}</small></div></button>`}
function skeleton(){return '<div class="mixrow loading" aria-hidden="true"><div class="skeltape"><i></i><i></i></div><div class="copy"><div class="skel"></div><div class="skel short"></div></div></div>'}
function notice(text){return `<div class="notice" role="alert"><span>${text}</span>${button('Retry',"setState('ready')",'textbutton')}</div>`}
function setState(s){el('state').value=s;render()}
function preview(text){el('note').textContent='Preview interaction: '+text+'. The production implementation will use the existing app flow.'}
let draft='', mixView='list', placeholderIndex=0;
const placeholders=['A slow evening, nothing too loud…','Something for the long way home…','Start with one song you love…'];
function themeToggle(){const dark=el('theme').value==='dark';return `<button class="theme-toggle" role="switch" aria-label="Dark mode" aria-checked="${dark}" title="Switch to ${dark?'light':'dark'} mode" onclick="changeTheme(el('theme').value==='dark'?'light':'dark')"><svg viewBox="0 0 60 32" aria-hidden="true"><defs><mask id="moon-cut"><rect width="60" height="32" fill="white"/><circle class="moon-cut" cx="16" cy="16" r="8" fill="black"/></mask></defs><rect class="toggle-track" x="1" y="1" width="58" height="30" rx="15"/><g class="toggle-thumb"><circle class="toggle-disc" cx="16" cy="16" r="12"/><g class="sun-rays" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M16 6v2M16 24v2M6 16h2M24 16h2M9 9l1.5 1.5M21.5 21.5 23 23M9 23l1.5-1.5M21.5 10.5 23 9"/></g><circle class="sun-moon" cx="16" cy="16" r="5" fill="currentColor" mask="url(#moon-cut)"/></g></svg></button>`}
function changeTheme(value){el('theme').value=value;el('shell').classList.toggle('light',value==='light');el('shell').classList.toggle('dark',value==='dark');const toggle=document.querySelector('.theme-toggle');toggle.setAttribute('aria-checked',String(value==='dark'));toggle.title='Switch to '+(value==='dark'?'light':'dark')+' mode'}
function voice(value){draft=el('prompt')?.value??draft;el('voiceState').value=value;render()}
function view(value){mixView=value;render()}
function composer(){const v=el('voiceState').value;return `<div class="home-compose">${v==='denied'||v==='failed'?`<div class="voice-error" role="alert"><span>${v==='denied'?'Microphone access is blocked. You can still type.':'Couldn’t transcribe that recording. Try again or type.'}</span><button class="textbutton" onclick="voice('idle')">Dismiss</button></div>`:''}<div class="composer">${v==='recording'?'<div class="voice-status" role="status"><i class="record-dot"></i><strong>Listening…</strong></div>':v==='transcribing'?'<div class="voice-status" role="status">Transcribing…</div>':`<textarea id="prompt" aria-label="Describe your mix" rows="1" placeholder="${placeholders[placeholderIndex]}" oninput="draft=this.value;el('send').disabled=!this.value.trim()"></textarea>`}<button class="voice" aria-label="${v==='recording'?'Stop recording':v==='transcribing'?'Cancel transcription':'Record a voice prompt'}" aria-pressed="${v==='recording'}" onclick="voice('${v==='recording'?'transcribing':v==='transcribing'?'idle':'recording'}')">${v==='recording'?'<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"/></svg>'}</button><button id="send" class="send" aria-label="Make a mix" ${!draft.trim()||v==='recording'||v==='transcribing'?'disabled':''} onclick="preview('Create a mix from your prompt')">${icon('Send')}</button></div></div>`}
function render(){let page=el('page').value,s=el('state').value,narrow=el('narrow').checked;el('shell').className='shell '+el('theme').value+(narrow?' narrow':'')+(el('large').checked?' large':'');let active=page==='Sources'?'Library':page;
el('sidebar').innerHTML='<div class="wordmark">mixtape</div><nav class="nav" aria-label="Main navigation">'+['Home','Library','Mixes'].map(n=>nav(n,active)).join('')+(narrow?nav('Settings',active):'')+'</nav><div class="sidebar-bottom"><nav class="nav" aria-label="Settings">'+nav('Settings',active)+'</nav>'+themeToggle()+'</div>';
let title=page==='Sources'?'Library':page;
let badge=(page==='Library'||page==='Sources')&&s!=='empty'&&s!=='unavailable'&&s!=='loading'?`<span class="badge">${brand('Spotify')}Spotify · Imported</span>`:'';
let content=`<header class="titleline"><h1>${title}</h1>${badge}${page==='Mixes'?button('Make a mix',"go('Home')",'button newmix'):''}</header>`;
if(page==='Home'){
content+='<div class="home-feed">';
if(s==='ready'||s==='success')content+=`<section class="section"><div class="sectionhead"><h2>For this moment</h2></div><div class="recommendation">${art()}<div class="copy"><h3>Your evening wind-down</h3><p class="muted">You often choose gentler mixes around this time.</p></div><div class="actions">${button('Make this mix',"preview('Create the suggested mix')")}${button('Not today',"setState('empty')",'textbutton')}</div></div></section>`;
if(s==='loading')content+='<section class="section" aria-label="Loading recommendation" aria-busy="true"><h2>For this moment</h2>'+skeleton()+'</section>';
if(s==='error'||s==='unavailable')content+='<section class="section">'+notice('Recommendations are unavailable right now. You can still start a mix.')+'</section>';
content+=`<section class="section"><div class="sectionhead"><h2>Recently played</h2>${s!=='empty'?button('All mixes →',"go('Mixes')",'textbutton'):''}</div>`;
content+=s==='unavailable'?notice('Couldn’t load recent mixes.'):s==='empty'?'<p class="muted">Your mixes will appear here. Start with what you feel like hearing.</p>':s==='loading'?'<div class="recent" aria-busy="true" aria-label="Loading recent mixes">'+skeleton()+skeleton()+'</div>':'<div class="recent">'+tapes.map(row).join('')+'</div>';
content+='</section></div>'+composer();
}
if(page==='Library'||page==='Sources'){
content+=`<nav class="tabs" aria-label="Library sections"><button ${page==='Library'?'aria-current="page"':''} onclick="go('Library')">Playlists</button><button ${page==='Sources'?'aria-current="page"':''} onclick="go('Sources')">Sources</button></nav>`;
if(page==='Library'){
content+='<div class="filters"><input aria-label="Search playlists" placeholder="Search playlists" oninput="filter(this.value)"><select aria-label="Filter music source"><option>All sources</option><option>Spotify</option><option>Apple Music</option></select><small>'+(s==='loading'?'Loading playlists…':s==='unavailable'?'':s==='empty'?'0 playlists':'12 playlists')+'</small></div>';
if(s==='error')content+=notice('Couldn’t refresh playlists. Your last loaded collection is shown.');
if(s==='success')content+='<div class="notice" role="status">Library updated. Your playlists are ready.</div>';
if(s==='unavailable')content+=notice('Couldn’t load your playlists.');
else if(s==='empty')content+='<div class="empty"><h2>No playlists yet</h2><p class="footnote">Connect Apple Music or import your Spotify playlists.</p>'+button('Add a music source',"go('Sources')",'textbutton')+'</div>';
else content+='<div class="playlistgrid" '+(s==='loading'?'aria-busy="true" aria-label="Loading playlists"':'')+'>'+['Window seat','Soft focus','After the rain','Side streets','Night bus','Golden hour','A quieter kind of good','Small celebrations','Slow mornings','Keep moving','Sunday records','Somewhere between here and home'].map((name,i)=>s==='loading'?'<div class="loading" aria-hidden="true"><div class="cover"></div><div class="skel"></div><div class="skel short"></div></div>':`<button class="playlist" data-name="${name.toLowerCase()}" onclick="preview('Open playlist: ${name}')"><div class="cover">${icon('Library')}</div><h3>${name}</h3><small>Spotify · ${14+i*8} songs</small></button>`).join('')+'</div>';
}else{
content+='<p class="sourceintro">Bring your music. Build mixes that feel like you.</p>';
if(s==='error')content+=notice('Apple Music access was not granted. Your imported music is still available.');
if(s==='success')content+='<div class="notice" role="status">Spotify import complete. 12 playlists are ready.</div>';
for(const provider of ['Apple','Spotify']){let connected=provider==='Spotify'&&s!=='empty';content+=`<div class="source" ${s==='loading'?'aria-busy="true"':''}>${brand(provider)}<div><h3>${provider==='Apple'?'Apple Music':'Spotify'}</h3>${s==='loading'?'<div class="skel"></div>':`<p>${provider==='Apple'?'Listen and sync your songs and playlists.':connected?'12 playlists · Imported 28 Sep':'Import saved music and playlists from an export.'}</p>`}</div><span class="status">${s==='loading'?'Checking…':connected?'Imported':'Not connected'}</span><button class="button compact" ${s==='loading'?'disabled':''} onclick="preview('${provider==='Apple'?'Apple Music authorization':'Spotify import'}')">${provider==='Apple'?'Connect':connected?'Manage import':'Import'}</button></div>`}
content+='<p class="footnote">Spotify imports are snapshots, not a live connection. Adding a source keeps your existing music.</p>';
}}
if(page==='Mixes'){
content+=`<div class="mix-toolbar"><nav class="tabs"><button aria-current="page" onclick="preview('Active mixes')">Active</button><button onclick="preview('Archived mixes')">Archived</button></nav><div class="view-switch" aria-label="Mix display"><button aria-pressed="${mixView==='list'}" onclick="view('list')">List</button><button aria-pressed="${mixView==='closet'}" onclick="view('closet')">Closet</button></div></div>`;
if(s==='error')content+=notice('Couldn’t refresh mixes. Your last loaded mixes are still here.');
content+=s==='unavailable'?notice('Couldn’t load your mixes.'):s==='empty'?'<div class="empty">No mixes yet. Start one from Home.</div>':s==='loading'?'<div aria-busy="true" aria-label="Loading mixes">'+skeleton()+skeleton()+skeleton()+'</div>':'<div>'+tapes.map(row).join('')+'</div>';
if(mixView==='closet'&&s==='ready')content=content.slice(0,content.indexOf('<div><button class="mixrow"'))+'<div class="closet-preview">'+tapes.map(n=>`<button class="spine" onclick="preview(&quot;Open mix&quot;)">${n}</button>`).join('')+'</div>';
}
if(page==='Settings'){
if(s==='error')content+=notice('Couldn’t save your preference. Your previous setting is unchanged.');
if(s==='success')content+='<div class="notice" role="status">Listening preferences saved.</div>';
content+='<section class="settinggroup"><h2>Listening preferences</h2><label class="settingrow"><span><strong>Learn from my listening</strong><p>Use playback in Mixtape to improve future mixes.</p></span><input type="checkbox" checked onchange="setState(\'success\')"></label><label class="settingrow"><span><strong>Recommend mixes</strong><p>Suggest a mix when a familiar listening moment comes around.</p></span><input type="checkbox" checked onchange="setState(\'success\')"></label><div class="settingrow"><div><h3>Remembered preferences</h3><p>Review what you’ve asked the DJ to remember.</p></div>'+button('Manage',"preview('Open existing memory controls')",'textbutton')+'</div></section><section class="settinggroup"><h2>Account</h2><div class="settingrow"><div><h3>Alex Morgan</h3><p>Signed in with Google</p></div>'+button('Manage account',"preview('Open existing account settings')",'textbutton')+'</div><div class="settingrow"><span>Sign out of Mixtape</span>'+button('Sign out',"preview('Sign out using the existing account flow')",'textbutton')+'</div></section>';
}
if(page==='Sources'&&s==='unavailable')content='<header class="titleline"><h1>Library</h1></header><nav class="tabs"><button onclick="go(&quot;Library&quot;)">Playlists</button><button aria-current="page">Sources</button></nav>'+notice('Couldn’t check your music sources.');
if(page==='Settings'&&(s==='loading'||s==='unavailable'))content='<header class="titleline"><h1>Settings</h1></header>'+ (s==='unavailable'?notice('Couldn’t load your settings.'): '<section aria-busy="true" aria-label="Loading settings"><h2>Listening preferences</h2>'+skeleton()+skeleton()+'</section>');
el('main').className='main'+(page==='Home'?' home-layout':'');
el('main').innerHTML=content;if(el('prompt'))el('prompt').value=draft;
el('note').textContent='Review scope: web, dark/light, desktop and 390px, large text, reduced motion. One shared navigation gutter. Library badges sit beside its title. Playlist covers are about 145–180px on desktop. No recommendation block when none is available; failures stay local to the affected section. Existing dialogs and the cassette rack retain their approved design. Source marks reuse existing brand geometry; use the Apple mark with the full Apple Music label, never a generic music-note icon. Bottom composer is always visible; the feed scrolls above it. Placeholders change every five seconds only while idle, and stay static with reduced motion. Voice controls simulate recording states without accessing a microphone; a transcript will be editable before sending. The 44px appearance control slides and morphs sun/moon over 280ms; reduced motion switches instantly. Theme switching preserves the draft. Home input uses 14px text at normal size and scales in large-text mode. Closet styling is illustrative; reuse the approved rack in implementation. Mix opening/creation and provider authorization are preview-only.';
}
function filter(q){document.querySelectorAll('.playlist').forEach(c=>c.hidden=!c.dataset.name.includes(q.toLowerCase()))}
for(const id of ['page','state','theme','narrow','large','voiceState'])el(id).addEventListener('change',render);render();
setInterval(()=>{const input=el('prompt');if(!input||input.value||document.activeElement===input||matchMedia('(prefers-reduced-motion: reduce)').matches)return;placeholderIndex=(placeholderIndex+1)%placeholders.length;input.placeholder=placeholders[placeholderIndex]},5000);
</script></html>
